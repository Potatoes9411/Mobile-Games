<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1E">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------------------
   POCKET ARCADE
   Three full games behind one hub. Dark cabinet chrome, each game carrying its
   own accent through the tile, the HUD and its results screen.
   --------------------------------------------------------------------------- */
:root{
  --void:#0E0B1E;
  --panel:#191233;
  --panel-2:#241A45;
  --line:#33285C;
  --ink:#F4F1FF;
  --dim:#9A92C4;
  --gem:#7BE0FF;
  --gold:#FFC24B;
  --jade:#3FD98A;
  --rose:#FF4D6D;
  --accent:#3D8BFF;
  --display:"Titan One","Arial Black",system-ui,sans-serif;
  --ui:"Barlow Semi Condensed","Segoe UI",Roboto,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void)}
body{
  font-family:var(--ui);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;touch-action:none;
}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block}

#shell{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;overflow-y:auto}
.screen[hidden]{display:none}
.wrap{width:min(620px,100%);margin:0 auto;padding:0 16px}

/* -------------------------------------------------------------- home ---- */
#home{
  background:
    radial-gradient(120% 70% at 50% -10%, #2C1F58 0%, transparent 62%),
    linear-gradient(180deg,#140F2B,#0E0B1E);
}
.topline{display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top))}
.avatar{
  width:52px;height:52px;border-radius:15px;flex:none;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:2px solid var(--line);overflow:hidden;
}
.avatar canvas{width:100%;height:100%;display:block}
.levelbox{flex:1;min-width:0}
.levelrow{display:flex;align-items:baseline;gap:8px}
.levelrow b{font-family:var(--display);font-size:17px}
.levelrow span{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.xpbar{margin-top:5px;height:9px;border-radius:99px;background:#100C24;border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6E5BFF,#7BE0FF);transition:width .35s}
.gems{
  display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:17px;color:var(--gem);
  background:#100C24;border:2px solid var(--line);border-radius:12px;padding:8px 11px 6px;
  font-variant-numeric:tabular-nums;
}
.gems b{
  width:15px;height:15px;display:block;background:var(--gem);
  clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);
}

h2.section{
  font-family:var(--display);font-size:14px;letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:10px;
}
h2.section::after{content:"";flex:1;height:1px;background:var(--line)}

.wordmark{
  font-family:var(--display);font-size:15px;letter-spacing:.26em;
  color:var(--ink);text-transform:uppercase;opacity:.9;
}
.wordmark b{color:var(--gem)}

#tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:380px){ #tiles{grid-template-columns:1fr} }

.tile{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  padding:0;border-radius:18px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:2px solid var(--line);
  box-shadow:0 5px 0 rgba(0,0,0,.45);
  transition:transform .08s,box-shadow .08s,border-color .2s;
  appearance:none;font:inherit;color:inherit;width:100%;
}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tile canvas{width:100%;aspect-ratio:16/11;display:block;background:#0B0818;border-bottom:2px solid var(--line)}
.tile .body{padding:10px 11px 12px}
.tile h3{margin:0;font-family:var(--display);font-size:15px;line-height:1.15}
.tile .genre{margin:3px 0 0;font-family:var(--display);font-size:10px;letter-spacing:.16em;opacity:.85}
.tile p{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.32;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .best{
  margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);
  display:flex;align-items:center;gap:5px;
}
.tile .best::before{content:"";width:5px;height:5px;border-radius:99px;background:currentColor}
.tile .flag{
  position:absolute;top:8px;left:8px;font-family:var(--display);font-size:10px;letter-spacing:.12em;
  padding:4px 7px 3px;border-radius:6px;background:var(--jade);color:#06301C;
}
.tile.locked{cursor:not-allowed}
.tile.locked canvas{filter:grayscale(1) brightness(.42)}
.tile.locked .flag{background:#3A3160;color:var(--dim)}

/* ---------------------------------------------------------- missions ---- */
.mission{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:11px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  margin-bottom:8px;
}
.mission h4{margin:0;font-size:14px;font-weight:700;letter-spacing:.03em}
.mission .bar{margin-top:6px;height:7px;border-radius:99px;background:#100C24;overflow:hidden}
.mission .bar i{display:block;height:100%;width:0;background:var(--jade);border-radius:99px}
.mission .rw{
  font-family:var(--display);font-size:14px;color:var(--gem);display:flex;align-items:center;gap:5px;
}
.mission .rw b{width:11px;height:11px;background:var(--gem);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.mission.done{border-color:var(--jade)}
.mission.done .rw{color:var(--jade)}

.streak{
  display:flex;gap:6px;margin-bottom:12px;
}
.streak i{
  flex:1;height:6px;border-radius:99px;background:#100C24;border:1px solid var(--line);
}
.streak i.on{background:linear-gradient(90deg,var(--gold),#FF8A3D);border-color:transparent}

/* --------------------------------------------------------- game HUD ----- */
#gameUi{position:absolute;inset:0;pointer-events:none}
#gameUi[hidden]{display:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
     padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.hud .row{display:flex;align-items:center;gap:10px}
.hud .row:first-child{padding-left:78px}
.chip{
  font-family:var(--display);font-size:14px;letter-spacing:.02em;
  background:rgba(14,11,30,.72);border:2px solid rgba(255,255,255,.16);
  border-radius:11px;padding:7px 10px 5px;backdrop-filter:blur(6px);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip.gold{color:var(--gold)}
.chip.gem{color:var(--gem)}
.meter{
  flex:1;height:14px;border-radius:99px;background:rgba(14,11,30,.72);
  border:2px solid rgba(255,255,255,.16);overflow:hidden;position:relative;
}
.meter i{position:absolute;inset:1px auto 1px 1px;width:0;border-radius:99px;
  background:linear-gradient(180deg,#8BF3BE,var(--jade));transition:width .12s linear}
.meter.xp i{background:linear-gradient(180deg,#9E8BFF,#6E5BFF)}
.meter.hp i{background:linear-gradient(180deg,#FF8A9E,var(--rose));transition:width .2s}
.bigNum{
  font-family:var(--display);font-size:clamp(40px,11vw,66px);line-height:1;text-align:center;
  margin-top:10px;color:#fff;font-variant-numeric:tabular-nums;
  -webkit-text-stroke:5px #1A1428;paint-order:stroke fill;
  text-shadow:0 5px 0 rgba(20,15,35,.6);transition:transform .09s;
}
.bigNum.pop{transform:scale(1.13)}
.cap{text-align:center;font-size:12px;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.72);
     text-shadow:0 1px 3px rgba(6,4,16,.9),0 0 10px rgba(6,4,16,.7);
     text-transform:uppercase;margin-top:-1px;text-shadow:0 2px 3px rgba(0,0,0,.6)}
.hint{margin-top:auto;text-align:center;font-size:14px;font-weight:700;letter-spacing:.18em;
      text-shadow:0 1px 3px rgba(6,4,16,.9),0 0 10px rgba(6,4,16,.7);
      text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 2px 4px rgba(0,0,0,.7)}
.backBtn{
  position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;pointer-events:auto;
  appearance:none;border:2px solid rgba(255,255,255,.18);background:rgba(14,11,30,.72);
  color:var(--ink);font-family:var(--display);font-size:13px;border-radius:11px;
  padding:8px 11px 6px;cursor:pointer;
}

/* An in-game action button. Sits above the thumb rest on the right so it never
   overlaps the steering half of the screen. */
.fireBtn{
  position:absolute;right:16px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));
  pointer-events:auto;appearance:none;cursor:pointer;
  width:76px;height:76px;border-radius:50%;
  border:3px solid rgba(255,255,255,.16);background:rgba(14,11,30,.66);
  color:rgba(255,255,255,.45);font-family:var(--display);font-size:12px;
  letter-spacing:.04em;line-height:1.05;padding:0 6px;
  transition:background .15s,color .15s,border-color .15s,transform .1s;
}
.fireBtn.ready{
  border-color:rgba(93,224,255,.85);color:#EAFBFF;
  background:radial-gradient(70% 70% at 50% 35%,rgba(93,224,255,.42),rgba(14,11,30,.82));
  box-shadow:0 0 22px rgba(93,224,255,.35);
}
.fireBtn:active{transform:scale(.94)}

.pauseBtn{
  position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;pointer-events:auto;
  appearance:none;border:2px solid rgba(255,255,255,.18);background:rgba(14,11,30,.72);
  color:var(--ink);font-family:var(--display);font-size:13px;border-radius:11px;
  padding:8px 12px 6px;cursor:pointer;
}

#pause{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;
       align-items:center;justify-content:center;padding:20px;z-index:40;
       background:radial-gradient(80% 60% at 50% 40%,rgba(14,11,30,.82),rgba(14,11,30,.97))}
#pause[hidden]{display:none}

/* Settings rows: a label on the left, the control hard right. */
.setRow{display:flex;align-items:center;justify-content:space-between;gap:14px;
        padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.setRow:last-of-type{border-bottom:0}
.setRow h4{margin:0;font-family:var(--display);font-size:14px;letter-spacing:.04em}
.setRow p{margin:3px 0 0;font-size:12px;color:rgba(255,255,255,.5)}
.setRow input[type=range]{width:130px;accent-color:var(--gem)}
.segmented{display:flex;gap:6px}
.segmented button{
  appearance:none;cursor:pointer;border:2px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.62);
  font-family:var(--display);font-size:12px;border-radius:9px;padding:7px 10px 5px;
}
.segmented button.on{border-color:var(--gem);color:#EAFBFF;background:rgba(93,224,255,.16)}

/* ---------------------------------------------------------- overlays ---- */
#modal{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;
       align-items:center;justify-content:center;padding:20px;
       background:radial-gradient(80% 60% at 50% 40%,rgba(14,11,30,.72),rgba(14,11,30,.94))}
#modal[hidden]{display:none}
.card{
  width:min(460px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:2px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 14px 0 rgba(0,0,0,.45);
}
.card h2{margin:0 0 4px;font-family:var(--display);font-size:30px;text-align:center}
.card .sub{margin:0 0 14px;text-align:center;font-size:13px;font-weight:700;letter-spacing:.16em;
           text-transform:uppercase;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:#130E29;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

.btn{
  appearance:none;border:0;cursor:pointer;display:block;width:100%;margin-top:10px;
  font-family:var(--display);font-size:19px;color:#0B1226;padding:15px 18px 12px;border-radius:15px;
  background:linear-gradient(180deg,#7FB8FF,var(--accent) 60%,#2F72DE);
  border:3px solid rgba(255,255,255,.32);
  box-shadow:0 6px 0 rgba(0,0,0,.5);
  transition:transform .07s,box-shadow .07s,filter .18s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.go{background:linear-gradient(180deg,#8BF3BE,var(--jade) 60%,#25A868);color:#08321F}
.btn.gold{background:linear-gradient(180deg,#FFE08A,var(--gold) 60%,#E09A18);color:#3A2504}
.btn.ghost{background:linear-gradient(180deg,#4B3F78,#2E2550);color:var(--ink)}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:default;transform:none}
.btn small{display:block;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.14em;opacity:.75}

/* level-up draft cards */
.draft{display:flex;flex-direction:column;gap:10px;width:min(460px,100%)}
.pick{
  display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;cursor:pointer;
  padding:13px;border-radius:16px;text-align:left;appearance:none;font:inherit;color:inherit;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:2px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.45);
  transition:transform .07s,box-shadow .07s,border-color .2s;
}
.pick:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pick .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;
           font-family:var(--display);font-size:24px;color:#0B1226}
.pick h3{margin:0;font-family:var(--display);font-size:17px}
.pick p{margin:3px 0 0;font-size:13px;color:var(--dim);line-height:1.3}
.pick .lvl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.pick.evolve{border-color:var(--gold);box-shadow:0 5px 0 rgba(120,80,0,.5)}

/* shop rows */
.shopRow{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px;
}
.shopRow h4{margin:0;font-family:var(--display);font-size:15px}
.shopRow p{margin:3px 0 0;font-size:12px;color:var(--dim)}
.shopRow .buy{
  appearance:none;border:0;cursor:pointer;min-width:92px;
  font-family:var(--display);font-size:15px;color:#08321F;padding:11px 10px 9px;border-radius:11px;
  background:linear-gradient(180deg,#8BF3BE,var(--jade));box-shadow:0 4px 0 #1B7A4A;
  font-variant-numeric:tabular-nums;
}
.shopRow .buy:active{transform:translateY(2px);box-shadow:0 2px 0 #1B7A4A}
.shopRow .buy[disabled]{background:#39305C;color:var(--dim);box-shadow:0 4px 0 #221B3D;cursor:default}
.shopRow .buy small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.12em;opacity:.7}

#toasts{position:absolute;left:0;right:0;bottom:max(84px,env(safe-area-inset-bottom));
        display:flex;flex-direction:column-reverse;align-items:center;gap:7px;pointer-events:none}
.toast{
  font-family:var(--display);font-size:14px;padding:9px 15px 7px;border-radius:99px;
  background:rgba(14,11,30,.92);border:2px solid var(--line);
  animation:toastIn .28s ease-out, toastOut .3s ease-in 2s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

.footRow{display:flex;gap:10px;margin:18px 0 26px}
.footRow button{
  flex:1;appearance:none;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="shell">

  <div class="screen" id="home">
    <div class="wrap">
      <div class="topline">
        <div class="avatar"><canvas id="avatarCanvas" width="104" height="104"></canvas></div>
        <div class="levelbox">
          <div class="levelrow"><b id="acctLevel">LV 1</b><span id="acctXp">0 / 120 XP</span></div>
          <div class="xpbar"><i id="acctBar"></i></div>
        </div>
        <div class="gems"><b></b><span id="gemCount">0</span></div>
      </div>

      <div class="wordmark" style="margin-top:18px">POCKET <b>ARCADE</b></div>
      <h2 class="section">All games</h2>
      <div id="tiles"></div>

      <h2 class="section">Daily missions</h2>
      <div class="streak" id="streak"></div>
      <div id="missions"></div>

      <div class="footRow">
        <button id="settingsBtn">Settings</button>
        <button id="gemShopBtn">Prestige shop</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div id="gameUi" hidden></div>
  <div id="modal" hidden></div>
  <div id="pause" hidden>
    <div class="card">
      <h2>PAUSED</h2>
      <p class="sub" id="pauseName"></p>
      <button class="go" id="pauseResume">RESUME</button>
      <button class="gold" id="pauseSettings">SETTINGS</button>
      <button class="ghost" id="pauseQuit">RETURN TO HUB</button>
    </div>
  </div>
  <div id="toasts"></div>
</div>

<script>
/* ---- src/engine/core.js ---- */
/* ===========================================================================
   ARCADE ENGINE - core
   Shared math, deterministic RNG, persistent save, audio, input and the frame
   loop. Every game in the hub is built on this. Classic script, no modules, so
   the whole thing still runs from a file:// double-click.
   =========================================================================== */
window.A = window.A || {};

(function (A) {
  "use strict";

  /* ------------------------------------------------------------- math ---- */
  A.TAU = Math.PI * 2;
  A.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  A.clamp01 = function (v) { return A.clamp(v, 0, 1); };
  A.lerp = function (a, b, t) { return a + (b - a) * t; };
  A.invLerp = function (a, b, v) { return a === b ? 0 : A.clamp01((v - a) / (b - a)); };
  A.smooth = function (t) { return t * t * (3 - 2 * t); };
  A.approach = function (current, target, rate, dt) {
    return current + (target - current) * (1 - Math.exp(-rate * dt));
  };
  A.wrap = function (v, m) { return ((v % m) + m) % m; };
  A.dist2 = function (ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  };

  /** Unity's SmoothDamp, scalar. Returns [value, velocity]. */
  A.smoothDamp = function (current, target, velocity, smoothTime, maxSpeed, dt) {
    smoothTime = Math.max(0.0001, smoothTime);
    var omega = 2 / smoothTime;
    var x = omega * dt;
    var exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    var change = A.clamp(current - target, -maxSpeed * smoothTime, maxSpeed * smoothTime);
    var temp = (velocity + omega * change) * dt;
    var newVel = (velocity - omega * temp) * exp;
    var output = (current - change) + (change + temp) * exp;
    if ((target - current > 0) === (output > target)) {
      output = target;
      newVel = (output - target) / dt;
    }
    return [output, newVel];
  };

  /** Deterministic RNG. Same seed, same world, every time. */
  A.rng = function (seed) {
    var a = (seed >>> 0) || 1;
    var next = function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.range = function (lo, hi) { return lo + next() * (hi - lo); };
    next.int = function (lo, hi) { return Math.floor(next.range(lo, hi + 1)); };
    next.chance = function (p) { return next() < p; };
    next.pick = function (list) { return list[Math.floor(next() * list.length) % list.length]; };
    next.shuffle = function (list) {
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(next() * (i + 1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
      return list;
    };
    return next;
  };

  /* ------------------------------------------------------------ colour --- */
  A.rgb = function (c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; };
  A.rgba = function (c, alpha) {

<script>
/* ---- src/games/mobclash.js ---- */
/* ===========================================================================
   MOB CLASH: GATE SIEGE
   Swerve a crowd through math gates, then spend the horde storming a keep one
   room at a time. The pacing generator below is unchanged from the standalone
   build and is verified solvable for every level it produces; the runtime and
   renderer sit on the shared arcade engine.
   =========================================================================== */
(function (A) {
  "use strict";
  A.games = A.games || [];

  var TAU = A.TAU;
  var MAX_CROWD = 99999;
  var clamp = A.clamp, clamp01 = A.clamp01, lerp = A.lerp, invLerp = A.invLerp;
  var smoothDamp = A.smoothDamp;

  /* ------------------------------------------------------- gate maths --- */
  function applyGate(crowd, type, value) {
    var r;
    if (type === "add") r = crowd + value;
    else if (type === "sub") r = crowd - value;
    else if (type === "mul") r = value <= 0 ? crowd : crowd * value;
    else r = value <= 1 ? crowd : Math.round(crowd / value);
    return clamp(Math.round(r), 0, MAX_CROWD);
  }

  function gateLabel(type, value) {
    return type === "add" ? "+" + value :
           type === "sub" ? "\u2212" + value :
           type === "mul" ? "\u00D7" + value : "\u00F7" + value;
  }

  function gateIsGood(type, value) {
    return (type === "add" && value > 0) || (type === "mul" && value > 1);
  }

  const TUNE = {
    tutorialLevels: 3, masteryLevels: 10, feederInterval: 4, seed: 90211,
    baseTrackLength: 110, trackLengthPerLevel: 6, maxTrackLength: 300, trackHalfWidth: 6,
    baseRunSpeed: 12, runSpeedPerLevel: 0.11, maxRunSpeed: 18,
    tutorialRows: 3, masteryRows: 4, feederRows: 4, maxRows: 6,
    gateLane: 0.55, firstRowDistance: 26, finalRowPadding: 20,
    safeAddFraction: 0.65, trapSubtractFraction: 0.35,
    maxScatteredObstacles: 14, obstacleKillRadius: 1.15, attritionPerObstacle: 0.10,
    maxFloors: 6, tutorialDifficulty: 0.35, feederDifficulty: 0.30,
    coreStart: 0.55, coreEnd: 0.95, plateau: 40,
    floorWeightGrowth: 0.75, maxCasualty: 0.25,
    towerGap: 18
  };
  
  /** Greedy solver, mirrors LevelData.IsSolvable. */
  function isSolvable(nodes, crowd, casualtyRatio) {
    if (!nodes.length) return true;
    const cleared = nodes.map(() => false);
    const topFloor = nodes.reduce((m, n) => Math.max(m, n.floor), 0);
    let remaining = nodes.length, guard = 0;
  
    while (remaining > 0 && guard++ < 4096) {
      let unlocked = 0;
      for (let f = 0; f <= topFloor; f++) {
        const done = nodes.every((n, i) => n.floor !== f || cleared[i]);
        if (!done) { unlocked = f; break; }
        unlocked = f + 1;
      }
      let best = -1;
      nodes.forEach((n, i) => {
        if (cleared[i] || n.floor !== unlocked || n.power >= crowd) return;
        if (best < 0 || n.power < nodes[best].power) best = i;
      });
      if (best < 0) return false;
      const p = nodes[best].power;
      crowd += p - Math.round(p * casualtyRatio);
      cleared[best] = true;
      remaining--;
    }
    return remaining === 0;
  }
  
  function generateLevel(levelIndex, crowdAtStart, bias) {
    levelIndex = Math.max(1, levelIndex);
    crowdAtStart = clamp(crowdAtStart, 5, 500);
    bias = clamp(bias, 0.55, 1.25);
  
    const rand = A.rng(TUNE.seed + levelIndex * 7919);
    const rf = (a, b) => a + rand() * (b - a);
    const chance = p => rand() < p;
  
    const isTutorial = levelIndex <= TUNE.tutorialLevels;
    const isFeeder = !isTutorial && levelIndex % TUNE.feederInterval === 0;
  
    const level = {
      index: levelIndex, isTutorial, isFeeder,
      startingCrowd: crowdAtStart,
      halfWidth: TUNE.trackHalfWidth,
      speed: Math.min(TUNE.maxRunSpeed, TUNE.baseRunSpeed + TUNE.runSpeedPerLevel * (levelIndex - 1)),
      gates: [], obstacles: [], nodes: [], floorCount: 2,
      casualtyRatio: 0, goldPerUnit: 1, goldMultiplier: isFeeder ? 2 : 1,
      floorClearBonus: 20 + 5 * levelIndex,
      band: isTutorial ? "hook" : (isFeeder ? "gold rush" : (levelIndex <= TUNE.masteryLevels ? "mastery" : "core"))
    };
  
    const rawLength = TUNE.baseTrackLength + TUNE.trackLengthPerLevel * (levelIndex - 1);
    level.length = Math.min(TUNE.maxTrackLength, rawLength) * (isFeeder ? 0.92 : 1);
    level.towerDistance = level.length + TUNE.towerGap;
  
    /* --- hazards scattered along the track ------------------------------- */
    if (!isTutorial && !isFeeder) {
      const count = Math.round(lerp(1, TUNE.maxScatteredObstacles, invLerp(4, 30, levelIndex)));
      const from = TUNE.firstRowDistance - 8;
      const to = level.length - TUNE.finalRowPadding - 6;
      for (let i = 0; i < count && to > from; i++) {
        const o = { z: rf(from, to), lane: rf(-0.85, 0.85), r: TUNE.obstacleKillRadius, kind: "static", amp: 0, spd: 0, phase: rf(0, TAU) };
        if (levelIndex >= 16 && chance(0.30)) { o.kind = "spinner"; o.amp = rf(2.0, 3.2); o.spd = rf(0.45, 0.85); }
        else if (levelIndex >= 11 && chance(0.45)) { o.kind = "sweeper"; o.amp = rf(1.8, 3.4); o.spd = rf(0.35, 0.70); }
        level.obstacles.push(o);
      }
    }
  
    /* --- decision rows ---------------------------------------------------- */
    const rows = isTutorial ? TUNE.tutorialRows
      : isFeeder ? TUNE.feederRows
      : levelIndex <= TUNE.masteryLevels ? TUNE.masteryRows
      : clamp(TUNE.masteryRows + Math.floor((levelIndex - TUNE.masteryLevels) / 6), TUNE.masteryRows, TUNE.maxRows);
  
    const skill = isTutorial ? 0.99
      : isFeeder ? 0.95
      : levelIndex <= TUNE.masteryLevels ? 0.86
      : lerp(0.86, 0.70, invLerp(TUNE.masteryLevels, TUNE.plateau, levelIndex));
  
    const firstZ = TUNE.firstRowDistance;
    const lastZ = Math.max(firstZ + 12, level.length - TUNE.finalRowPadding);
    let expected = crowdAtStart;
    let previousZ = 0;
    let trapUsed = false;
  
    const riskyMotion = spec => {
      if (levelIndex >= 9 && chance(0.4)) { spec.motion = "rotate"; spec.amp = rf(2.2, 3.0); spec.spd = rf(0.30, 0.55); }
      else if (levelIndex >= 6) { spec.motion = "slide"; spec.amp = rf(1.8, 2.8); spec.spd = rf(0.35, 0.60); }
    };
  
    for (let row = 0; row < rows; row++) {
      const t = rows <= 1 ? 0.5 : row / (rows - 1);
      const z = lerp(firstZ, lastZ, t) + rf(-2, 2);
  
      let left = { type: "add", value: 10, motion: "static", amp: 0, spd: 0, risky: false };
      let right = { type: "mul", value: 2, motion: "static", amp: 0, spd: 0, risky: false };
  
      if (isTutorial) {
        /* The hook: both halves are gifts, so the win rate stays at 100%.
           The ladder ramps the finale crowd 600 -> 900 -> 1500 across levels 1-3. */
        const ladder = [[2, 3, 5], [3, 3, 5], [3, 5, 5]][clamp(levelIndex - 1, 0, 2)];
        let li = clamp(row, 0, 2);
        if (row === rows - 1) li = 2;
        left = { type: "mul", value: ladder[li], motion: "static", amp: 0, spd: 0, risky: false };
        right = { type: "add", value: Math.max(10, Math.round(expected * 0.6)), motion: "static", amp: 0, spd: 0, risky: false };
      } else if (isFeeder) {
        /* Gold rush. Multiplier rows alternate with additive rows: four stacked multipliers
           would compound into a five figure crowd and wreck the gold curve. */
        if (row % 2 === 0) {
          left = { type: "mul", value: 3, motion: "static", amp: 0, spd: 0, risky: false };
          right = { type: "mul", value: 2, motion: "static", amp: 0, spd: 0, risky: false };
        } else {
          left = { type: "add", value: Math.max(25, Math.round(expected * 1.2)), motion: "static", amp: 0, spd: 0, risky: false };
          right = { type: "add", value: Math.max(15, Math.round(expected * 0.7)), motion: "static", amp: 0, spd: 0, risky: false };
        }
      } else if (levelIndex <= TUNE.masteryLevels) {
        const safeAdd = Math.max(10, Math.round(expected * TUNE.safeAddFraction));
        const makeTrap = !trapUsed && levelIndex >= 7 && chance(0.35);
        if (makeTrap) { trapUsed = true; left = { type: "sub", value: Math.max(5, Math.round(expected * TUNE.trapSubtractFraction)), motion: "static", amp: 0, spd: 0, risky: false }; }
        else left = { type: "add", value: safeAdd, motion: "static", amp: 0, spd: 0, risky: false };
        right = { type: "mul", value: (levelIndex >= 8 && chance(0.4)) ? 3 : 2, motion: "static", amp: 0, spd: 0, risky: true };
        riskyMotion(right);
      } else {
        const roll = rand();
        if (roll < 0.45) {
          left = { type: "add", value: Math.max(12, Math.round(expected * TUNE.safeAddFraction)), motion: "static", amp: 0, spd: 0, risky: false };
          right = { type: "mul", value: chance(0.35) ? 3 : 2, motion: "static", amp: 0, spd: 0, risky: true };
          riskyMotion(right);
        } else if (roll < 0.75) {
          left = { type: "mul", value: 2, motion: "static", amp: 0, spd: 0, risky: false };
          right = { type: "mul", value: chance(0.30) ? 4 : 3, motion: "static", amp: 0, spd: 0, risky: true };
          riskyMotion(right);
        } else if (!trapUsed && expected > 40) {
          trapUsed = true;
          left = { type: "div", value: 2, motion: "static", amp: 0, spd: 0, risky: false };
          right = { type: "sub", value: Math.max(10, Math.round(expected * TUNE.trapSubtractFraction)), motion: chance(0.5) ? "slide" : "static", amp: 2.2, spd: 0.45, risky: false };
        } else {
          left = { type: "add", value: Math.max(15, Math.round(expected * 0.5)), motion: "slide", amp: 2.0, spd: 0.40, risky: false };
          right = { type: "mul", value: 2, motion: "static", amp: 0, spd: 0, risky: true };
          riskyMotion(right);
        }
      }
  
      if (chance(0.5)) { const s = left; left = right; right = s; }
  
      left.lane = -TUNE.gateLane; right.lane = TUNE.gateLane;
  
      [left, right].forEach(half => {
        half.z = z;
        half.row = row;
        half.phase = rf(0, TAU);
        if (half.risky && !isTutorial && !isFeeder) {
          const guards = levelIndex >= 12 ? 2 : 1;
          for (let g = 0; g < guards; g++) {
            const gz = z - 6 - g * 4.5;
            if (gz <= 8) continue;
            level.obstacles.push({
              z: gz, lane: half.lane + rf(-0.12, 0.12), r: TUNE.obstacleKillRadius, phase: rf(0, TAU),
              kind: levelIndex >= 10 ? "sweeper" : "static",
              amp: levelIndex >= 10 ? rf(1.2, 2.2) : 0,
              spd: levelIndex >= 10 ? rf(0.45, 0.80) : 0
            });
          }
        }
        level.gates.push(half);
      });
  
      /* simulate the reference run so the tower can be sized to the player */
      const a = applyGate(expected, left.type, left.value);
      const b = applyGate(expected, right.type, right.value);
      expected = Math.max(1, Math.round(lerp(Math.min(a, b), Math.max(a, b), skill)));
  
      const hazards = level.obstacles.filter(o => o.z > previousZ && o.z <= z).length;
      if (hazards > 0) expected = Math.max(1, Math.round(expected * Math.pow(1 - TUNE.attritionPerObstacle * (1 - skill), hazards)));
      previousZ = z;
    }
  
    const trailing = level.obstacles.filter(o => o.z > previousZ && o.z <= level.length).length;
    if (trailing > 0) expected = Math.max(1, Math.round(expected * Math.pow(1 - TUNE.attritionPerObstacle * (1 - skill), trailing)));
  
    level.expectedCrowd = clamp(expected, 5, MAX_CROWD);
  
    /* --- tower ------------------------------------------------------------ */
    const floors = (isTutorial || isFeeder) ? 2 : clamp(2 + Math.floor(levelIndex / 6), 2, TUNE.maxFloors);
    level.floorCount = floors;
  
    let ratio = isTutorial ? TUNE.tutorialDifficulty
      : isFeeder ? TUNE.feederDifficulty
      : lerp(TUNE.coreStart, TUNE.coreEnd, invLerp(4, TUNE.plateau, levelIndex));
    ratio *= bias;
    level.difficultyRatio = ratio;
    level.casualtyRatio = (isTutorial || isFeeder) ? 0 : lerp(0, TUNE.maxCasualty, invLerp(8, 30, levelIndex));
  
    const totalPower = Math.max(floors * 3, Math.round(level.expectedCrowd * ratio));
    const weights = [];
    let weightSum = 0;
    for (let f = 0; f < floors; f++) { weights[f] = 1 + TUNE.floorWeightGrowth * f; weightSum += weights[f]; }
  
    const nodes = [];
    for (let f = 0; f < floors; f++) {
      const floorPower = Math.max(2, Math.round(totalPower * (weights[f] / weightSum)));
      if (f === floors - 1) { nodes.push({ floor: f, slot: 0, power: floorPower, boss: true }); continue; }
  
      const slots = (levelIndex >= 15 && chance(0.45)) ? 3 : 2;
      const shares = [];
      let sum = 0;
      for (let s = 0; s < slots; s++) { shares[s] = (0.6 + s * 0.35) * rf(0.9, 1.1); sum += shares[s]; }
      for (let s = 0; s < slots; s++) {
        nodes.push({ floor: f, slot: s, power: Math.max(1, Math.round(floorPower * shares[s] / sum)), boss: false });
      }
    }
  
    /* Guarantee the tower is solvable by a reference crowd, and non trivial. */
    const scaleNodes = k => nodes.forEach(n => { n.power = clamp(Math.round(n.power * k), 1, MAX_CROWD); });
    const margin = (isTutorial || isFeeder) ? 0.70 : 0.90;
    const reference = Math.max(3, Math.round(level.expectedCrowd * margin));
    const trivial = Math.max(2, Math.round(level.expectedCrowd * 0.40));
  
    if (!isTutorial && !isFeeder) {
      let tighten = 0;
      while (tighten++ < 12 && isSolvable(nodes, trivial, level.casualtyRatio)) scaleNodes(1.08);
    }
    let relax = 0;
    while (relax++ < 32 && !isSolvable(nodes, reference, level.casualtyRatio)) scaleNodes(0.88);
    if (!isSolvable(nodes, reference, level.casualtyRatio)) {
      nodes.forEach(n => { n.power = Math.max(1, Math.round(reference * 0.35) + n.floor * 2); });
    }
  
    level.nodes = nodes;
    level.totalTowerPower = nodes.reduce((a, n) => a + n.power, 0);
    return level;
  }
  

  /* ======================================================== runtime ===== */
  var PAL = {
    skyTop: [27, 20, 54], skyMid: [122, 60, 104], skyLow: [244, 137, 75],
    sun: [255, 222, 150], fog: [236, 160, 116],
    hillFar: [92, 66, 116], hillNear: [56, 42, 82],
    grass: [46, 116, 88], grassDark: [30, 86, 66],
    road: [226, 199, 163], roadDark: [198, 169, 132], lane: [247, 232, 206],
    wall: [126, 96, 88], wallTop: [176, 140, 122],
    stone: [198, 182, 162], stoneDark: [168, 150, 132], stoneDeep: [112, 98, 88],
    gold: [255, 194, 75], jade: [63, 217, 138], red: [240, 77, 90], redDark: [130, 26, 38],
    blue: [61, 139, 255], ink: [36, 26, 56],
    tree: [38, 104, 78], treeDark: [24, 74, 56], trunk: [84, 58, 46]
  };

  var TOWER = { roomW: 3.5, roomH: 2.7, floorH: 3.7, baseY: 1.5, slot: 4.7, depth: 1.3 };
  var MAX_UNITS = 220;
  var SIEGE_UNITS = 130;

  function create(host) {
    var save = host.save;
    var cam = A.Camera3D();
    var mobAtlas = null, foeAtlas = null;
    var S = null;
    var ui = {};
    var clouds = null;
    var grads = null;

    function buildGradients(g) {
      var w = A.View.w, h = A.View.h;
      var bottom = cam.horizon + 2;

      var sky = g.createLinearGradient(0, 0, 0, bottom);
      sky.addColorStop(0, A.rgb(PAL.skyTop));
      sky.addColorStop(0.52, A.rgb(PAL.skyMid));
      sky.addColorStop(0.88, A.rgb(A.mix(PAL.skyMid, PAL.skyLow, 0.75)));
      sky.addColorStop(1, A.rgb(PAL.skyLow));

      var ground = g.createLinearGradient(0, cam.horizon, 0, h);
      ground.addColorStop(0, A.rgb(PAL.fog));
      ground.addColorStop(0.06, A.rgb(A.mix(PAL.grass, PAL.fog, 0.62)));
      ground.addColorStop(0.35, A.rgb(PAL.grass));
      ground.addColorStop(1, A.rgb(PAL.grassDark));

      var road = g.createLinearGradient(0, cam.horizon, 0, h);
      road.addColorStop(0, A.rgb(PAL.fog));
      road.addColorStop(0.08, A.rgb(A.mix(PAL.road, PAL.fog, 0.55)));
      road.addColorStop(0.4, A.rgb(PAL.road));
      road.addColorStop(1, A.rgb(PAL.roadDark));

      var vig = g.createRadialGradient(w / 2, h * 0.52, h * 0.28, w / 2, h * 0.52, h * 0.78);
      vig.addColorStop(0, "rgba(20,14,38,0)");
      vig.addColorStop(1, "rgba(20,14,38,0.45)");

      grads = { sky: sky, ground: ground, road: road, vig: vig, w: w, h: h, horizon: cam.horizon };
    }

    /* ------------------------------------------------------ economy ----- */
    function startingCrowd() { return 20 + save.upCrowd * 2; }
    function goldMultiplier() { return (1 + save.upGold * 0.15) * host.coinMultiplier(); }
    function gateFlat() { return save.upGate; }
    function gateMul() { return save.upGate * 0.05; }
    function ddsBias() { return clamp(1 - 0.08 * save.fails, 0.6, 1); }

    /* -------------------------------------------------------- assets ---- */
    function bake() {
      mobAtlas = A.Rig.bake(A.Rig.style(1201, {
        hue: host.hue, sat: 0.72, helmet: "crest", cape: false, weapon: "none", bulk: 1.0
      }), "run", 10, { cell: 82, ss: 2, height: 58 });

      foeAtlas = A.Rig.bake(A.Rig.style(7013, {
        hue: 0.02, sat: 0.7, helmet: "horned", cape: false, weapon: "axe", bulk: 1.08
      }), "march", 8, { cell: 82, ss: 2, height: 58 });

      var rand = A.rng(4242);
      clouds = [];
      for (var i = 0; i < 8; i++) {
        clouds.push({ x: rand(), y: 0.10 + rand() * 0.6, w: 0.07 + rand() * 0.12,
                      h: 0.012 + rand() * 0.02, a: 0.06 + rand() * 0.12, drift: 0.004 + rand() * 0.01 });
      }
    }

    /* --------------------------------------------------------- state ---- */
    function prepare() {
      var level = generateLevel(save.level, startingCrowd(), ddsBias());

      S = {
        phase: "ready",
        t: 0,
        level: level,
        player: { x: 0, z: 0, tx: 0, vx: 0 },
        crowd: 0,
        units: [],
        transitionT: 0,
        transitionFrom: 0,
        scenery: buildScenery(level),
        siege: null,
        reward: 0
      };

      level.gates.forEach(function (g) { g.consumed = false; });
      buildSiege();
      setCrowd(level.startingCrowd, true);
      moveCamera(0, true);
      paintHud();
    }

    function buildScenery(level) {
      var rand = A.rng(level.index * 104729 + 17);
      var out = [];
      var to = level.towerDistance + 60;
      for (var z = -20; z < to; z += 5.5 + rand() * 6) {
        for (var side = -1; side <= 1; side += 2) {
          if (rand() < 0.34) continue;
          var roll = rand();
          out.push({
            z: z + rand() * 3,
            x: side * (level.halfWidth + 3.5 + rand() * 26),
            kind: roll < 0.62 ? "tree" : (roll < 0.85 ? "rock" : "banner"),
            scale: 0.75 + rand() * 0.7
          });
        }
      }
      return out.sort(function (a, b) { return b.z - a.z; });
    }

    function visualCap() {
      return (S.phase === "siege" || S.phase === "transition" || S.phase === "done") ? SIEGE_UNITS : MAX_UNITS;
    }

    function setCrowd(n, quiet) {
      var before = S.crowd;
      S.crowd = clamp(Math.round(n), 0, MAX_CROWD);

      var want = Math.min(S.crowd, visualCap());
      while (S.units.length < want) {
        S.units.push({
          x: S.player.x + (Math.random() - 0.5) * 1.4,
          z: S.player.z + (Math.random() - 0.5) * 1.4,
          vx: 0, vz: 0,
          phase: Math.random(),
          damp: 0.11 + (Math.random() - 0.5) * 0.1,
          jx: (Math.random() - 0.5) * 0.4,
          jz: (Math.random() - 0.5) * 0.4,
          gait: 0.85 + Math.random() * 0.35
        });
      }
      if (S.units.length > want) S.units.length = want;

      if (!quiet && S.crowd !== before) paintCrowd(true);
      else paintCrowd(false);
    }

    function crowdRadius() {
      return Math.min(5.2, 0.44 * Math.sqrt(Math.max(1, S.units.length)));
    }

    /* --------------------------------------------------------- gates ---- */
    function gateHalfWidth() { return S.level.halfWidth * 0.5; }

    function gateX(g) {
      var base = (g.lane < 0 ? -1 : 1) * gateHalfWidth();
      var travel = Math.min(g.amp, gateHalfWidth() * 0.62);
      if (g.motion === "slide") return base + Math.sin(S.t * g.spd * TAU + g.phase) * travel;
      if (g.motion === "rotate") return base + Math.sin(S.t * g.spd * Math.PI + g.phase) * travel * 0.5;
      return base;
    }

    function obstaclePos(o) {
      var base = o.lane * (S.level.halfWidth - o.r);
      if (o.kind === "sweeper") return { x: base + Math.sin(S.t * o.spd * TAU + o.phase) * o.amp, z: o.z };
      if (o.kind === "spinner") {
        var a = (S.t * o.spd + o.phase) * TAU;
        return { x: base + Math.cos(a) * o.amp, z: o.z + Math.sin(a) * o.amp * 0.35 };
      }
      return { x: base, z: o.z };
    }

    function resolveGate(half) {
      var before = S.crowd;
      var after;
      if (half.type === "add") after = applyGate(before, "add", half.value + gateFlat());
      else if (half.type === "mul") after = clamp(Math.round(before * (half.value + gateMul())), 0, MAX_CROWD);
      else after = applyGate(before, half.type, half.value);

      setCrowd(after);

      var delta = after - before;
      var good = delta >= 0;
      var gx = gateX(half);

      A.Fx.text(gx, 4.2, half.z, (delta >= 0 ? "+" : "") + delta, good ? PAL.jade : PAL.red,
        { scale: 1.25, rise: 2.6 });
      A.Fx.burst(gx, 2.4, half.z, good ? 22 : 14, {
        color: good ? PAL.jade : PAL.red,
        speed: good ? 6.5 : 4.5, up: good ? 9 : 5, life: 0.55, size: 0.17, square: true
      });

      A.Fx.kick(good ? 0.3 : 0.6);
      if (!good) A.Fx.flashScreen(0.32, PAL.red);
      A.Audio.sfx(good ? "good" : "bad");
      A.vibrate(good ? 14 : 34);
    }

    function checkGates(prevZ, z) {
      var crossed = S.level.gates.filter(function (g) {
        return !g.consumed && g.z > prevZ && g.z <= z;
      });
      if (!crossed.length) return;

      var taken = null, best = Infinity;
      crossed.forEach(function (g) {
        var d = Math.abs(S.player.x - gateX(g));
        if (d < best) { best = d; taken = g; }
      });
      if (taken) resolveGate(taken);

      S.level.gates.forEach(function (g) {
        if (crossed.indexOf(g) >= 0 || (taken && g.row === taken.row)) g.consumed = true;
      });
    }

    function shaveObstacles() {
      var near = S.level.obstacles.filter(function (o) { return Math.abs(o.z - S.player.z) < 14; });
      if (!near.length || !S.units.length) return;

      var positions = near.map(obstaclePos);
      var killed = 0, lastX = 0, lastZ = 0;

      for (var i = S.units.length - 1; i >= 0; i--) {
        var u = S.units[i];
        for (var k = 0; k < positions.length; k++) {
          var dx = u.x - positions[k].x, dz = u.z - positions[k].z, r = near[k].r;
          if (dx * dx + dz * dz <= r * r) {
            lastX = u.x; lastZ = u.z;
            A.Fx.burst(u.x, 0.9, u.z, 4, { color: [176, 218, 255], speed: 3.5, up: 5, life: 0.5, size: 0.15 });
            S.units.splice(i, 1);
            killed++;
            break;
          }
        }
      }
      if (!killed) return;

      var perVisual = (S.units.length > 0 && S.crowd > S.units.length)
        ? Math.max(1, Math.round(S.crowd / S.units.length)) : 1;
      var loss = Math.min(S.crowd, killed * perVisual);
      S.crowd = Math.max(0, S.crowd - loss);
      paintCrowd(true);

      A.Fx.kick(0.3);
      A.Audio.sfx("hit");
      A.Fx.text(lastX, 2.8, lastZ, "-" + loss, PAL.red, { scale: 0.9, rise: 2.6 });
    }

    /* --------------------------------------------------------- siege ---- */
    function buildSiege() {
      S.siege = {
        nodes: S.level.nodes.map(function (n) {
          return { floor: n.floor, slot: n.slot, power: n.power, boss: n.boss,
                   state: n.floor === 0 ? "available" : "locked", rect: null, pulse: 0, reject: 0 };
        }),
        floor: 0, battle: null, deadlock: 0, live: false
      };
    }

    function roomWorld(node) {
      var slots = S.level.nodes.filter(function (n) { return n.floor === node.floor; }).length;
      return {
        x: (node.slot - (slots - 1) * 0.5) * TOWER.slot,
        y: TOWER.baseY + node.floor * TOWER.floorH,
        z: S.level.towerDistance - TOWER.depth
      };
    }

    function attackNode(node) {
      if (!S.siege.live || S.siege.battle || node.state !== "available") return;
      var w = roomWorld(node);

      if (S.crowd <= node.power) {
        node.reject = 0.34;
        A.Fx.kick(0.34);
        A.Fx.flashScreen(0.22, PAL.red);
        A.Audio.sfx("bad");
        A.vibrate(70);
        A.Fx.text(w.x, w.y + TOWER.roomH + 0.6, w.z, "TOO STRONG", PAL.red, { scale: 0.85 });
        return;
      }

      var casualties = Math.round(node.power * S.level.casualtyRatio);
      S.siege.battle = {
        node: node, t: 0, stage: "charge",
        start: S.crowd,
        trough: Math.max(1, S.crowd - node.power),
        final: Math.max(1, S.crowd + node.power - casualties),
        gain: node.power - casualties
      };
      A.Audio.sfx("select");
      A.vibrate(20);
    }

    function updateSiege(dt) {
      var s = S.siege;
      s.nodes.forEach(function (n) {
        if (n.pulse > 0) n.pulse -= dt;
        if (n.reject > 0) n.reject -= dt;
      });

      if (s.battle) {
        var b = s.battle;
        b.t += dt;

        if (b.stage === "charge") {
          var k = clamp01(b.t / 0.28);
          setCrowd(Math.round(lerp(b.start, b.trough, k)), true);
          if (k >= 1) {
            var w = roomWorld(b.node);
            b.stage = "absorb"; b.t = 0;
            b.node.pulse = 0.38;
            A.Fx.kick(0.62);
            A.Fx.flashScreen(0.3, [255, 255, 255]);
            A.Fx.hitStop(0.05);
            A.Audio.sfx("hit");
            A.vibrate(30);
            A.Fx.burst(w.x, w.y + TOWER.roomH * 0.5, w.z, 34,
              { color: PAL.stone, speed: 7, up: 9, life: 0.9, size: 0.26, square: true });
            A.Fx.text(w.x, w.y + TOWER.roomH + 0.4, w.z, "+" + b.gain, PAL.jade, { scale: 1.1 });
          }
        } else {
          var k2 = clamp01(b.t / 0.32);
          setCrowd(Math.round(lerp(b.trough, b.final, k2)), true);
          if (k2 >= 1) {
            setCrowd(b.final);
            b.node.state = "cleared";
            A.Audio.sfx("coin");

            var floorDone = s.nodes.every(function (n) { return n.floor !== s.floor || n.state === "cleared"; });
            if (floorDone && s.floor + 1 < S.level.floorCount) {
              s.floor++;
              s.nodes.forEach(function (n) { if (n.floor === s.floor && n.state === "locked") n.state = "available"; });
            }
            s.battle = null;
            if (s.nodes.every(function (n) { return n.state === "cleared"; })) finish(true);
          }
        }
        return;
      }

      var anyMove = s.nodes.some(function (n) { return n.state === "available" && S.crowd > n.power; });
      var allDone = s.nodes.every(function (n) { return n.state === "cleared"; });
      if (!anyMove && !allDone) {
        s.deadlock += dt;
        if (s.deadlock > 1.1) finish(false, "No room left that you outnumber");
      } else {
        s.deadlock = 0;
      }
    }

    /* -------------------------------------------------------- camera ---- */
    function moveCamera(dt, snap) {
      var siegeView = S.phase === "transition" || S.phase === "siege" || S.phase === "done";
      var target;

      if (siegeView) {
        var f = S.level.floorCount;
        target = { x: 0, y: 9 + f * 1.4, z: S.level.towerDistance - (16 + f * 2.4) };
      } else {
        target = { x: S.player.x * 0.55, y: 9.6, z: S.player.z - 13.5 };
      }

      cam.fit(A.View.w, A.View.h, 0.27, 0.56);
      if (snap) cam.moveTo(target.x, target.y, target.z);
      else cam.moveTo(target.x, target.y, target.z, S.phase === "run" ? 9 : 3.4, dt);
    }

    /* -------------------------------------------------------- update ---- */
    function update(dt) {
      S.t += dt;
      var level = S.level;

      if (S.phase === "ready") {
        if (A.Input.pressed || A.Input.tapped) {
          S.phase = "run";
          save.runs++;
          host.commit();
          if (ui.hint) ui.hint.textContent = "Drag to steer";
        }
      } else if (S.phase === "run") {
        if (A.Input.axis) S.player.tx += A.Input.axis * 11 * dt;
        if (A.Input.down) S.player.tx += (A.Input.dx / Math.min(A.View.w, 620)) * 13;

        var limit = Math.max(0.6, level.halfWidth - crowdRadius() * 0.42);
        S.player.tx = clamp(S.player.tx, -limit, limit);

        var prevZ = S.player.z;
        var step = smoothDamp(S.player.x, S.player.tx, S.player.vx, 0.085, 26, dt);
        S.player.x = step[0]; S.player.vx = step[1];
        S.player.z += level.speed * dt;

        checkGates(prevZ, S.player.z);
        shaveObstacles();

        if (S.crowd <= 0) finish(false, "The mob was wiped out on the track");
        else if (S.player.z >= level.length) {
          S.transitionFrom = S.player.z;
          S.transitionT = 0;
          S.phase = "transition";
          setCrowd(S.crowd, true);
        }
      } else if (S.phase === "transition") {
        S.transitionT += dt;
        var k = clamp01(S.transitionT / 1.15);
        S.player.z = lerp(S.transitionFrom, level.towerDistance - 8, A.smooth(k));
        S.player.x = A.approach(S.player.x, 0, 6, dt);
        S.player.tx = S.player.x;
        if (k >= 1) {
          S.phase = "siege";
          S.siege.live = true;
          if (ui.hint) ui.hint.textContent = "Tap a room you outnumber";
        }
      } else if (S.phase === "siege") {
        updateSiege(dt);
        if (A.Input.pressed) {
          for (var i = 0; i < S.siege.nodes.length; i++) {
            var n = S.siege.nodes[i];
            if (n.state === "cleared" || !n.rect) continue;
            var r = n.rect;
            if (A.Input.x >= r.x && A.Input.x <= r.x + r.w && A.Input.y >= r.y && A.Input.y <= r.y + r.h) {
              attackNode(n);
              break;
            }
          }
        }
      }

      updateUnits(dt);
      moveCamera(dt);
      paintProgress();
    }

    function updateUnits(dt) {
      var n = S.units.length;
      if (!n) return;

      var line = S.phase === "siege" || S.phase === "done";
      var radius = crowdRadius();
      var spreadX = line ? Math.min(12, 1.15 * Math.sqrt(n)) : radius;
      var spreadZ = line ? Math.min(3.6, 0.34 * Math.sqrt(n)) : radius;
      var cx = S.player.x, cz = S.player.z;

      for (var i = 0; i < n; i++) {
        var u = S.units[i];
        var slot = (i + 0.5) / n;
        var angle = i * 2.39996323;
        var r = Math.sqrt(slot);
        var a = smoothDamp(u.x, cx + Math.cos(angle) * r * spreadX + u.jx, u.vx, u.damp, 60, dt);
        var b = smoothDamp(u.z, cz + Math.sin(angle) * r * spreadZ + u.jz, u.vz, u.damp, 60, dt);
        u.x = a[0]; u.vx = a[1];
        u.z = b[0]; u.vz = b[1];
      }
    }

    /* -------------------------------------------------------- finish ---- */
    function finish(win, reason) {
      if (S.phase === "done") return;
      S.phase = "done";
      S.siege.live = false;

      var cleared = S.siege.nodes.filter(function (n) { return n.state === "cleared"; }).length;
      var raw = S.crowd * S.level.goldPerUnit + cleared * S.level.floorClearBonus;
      var gold = Math.round(raw * S.level.goldMultiplier * goldMultiplier() * (win ? 1 : 0.25));

      save.gold += gold;
      save.bestCrowd = Math.max(save.bestCrowd, S.crowd);
      if (win) { save.level++; save.wins++; save.fails = 0; }
      else save.fails++;
      host.commit();

      var xp = Math.round((cleared * 12 + S.level.index * 8) * host.xpMultiplier());
      host.addXp(xp);
      host.progress("run", 1);
      host.progress("coins", gold);
      host.progress("crowd", S.crowd);
      if (win) host.progress("tower", 1);

      A.Audio.sfx(win ? "win" : "lose");
      A.vibrate(win ? [20, 40, 30] : 110);
      if (win) {
        A.Fx.kick(0.7);
        A.Fx.flashScreen(0.4, PAL.gold);
        A.Fx.burst(0, TOWER.baseY + S.level.floorCount * TOWER.floorH, S.level.towerDistance, 80,
          { color: PAL.gold, speed: 11, up: 15, life: 1.5, size: 0.28, square: true, gravity: 16 });
      }

      host.results({
        win: win,
        title: win ? "TOWER TAKEN" : "SIEGE BROKEN",
        subtitle: win ? cleared + " rooms conquered" : (reason || "The mob fell short"),
        stats: [
          ["Level", String(S.level.index)],
          ["Final mob", A.formatNumber(S.crowd)],
          ["Gold", "+" + A.formatNumber(gold)],
          ["Account XP", "+" + A.formatNumber(xp)]
        ],
        buttons: [
          { label: win ? "NEXT LEVEL" : "TRY AGAIN", className: "go",
            onClick: function () { host.modal.hide(); prepare(); } },
          { label: "UPGRADES", className: "gold", onClick: openShop },
          { label: "MENU", className: "ghost", onClick: host.exit }
        ]
      });
    }

    function openShop() {
      var rows = [
        { key: "upCrowd", name: "Starting Mob", desc: "+2 runners at the start line", max: 40,
          cost: function (l) { return Math.round(120 * Math.pow(1.35, l)); } },
        { key: "upGold", name: "Gold Multiplier", desc: "+15% gold from every run", max: 30,
          cost: function (l) { return Math.round(300 * Math.pow(1.45, l)); } },
        { key: "upGate", name: "Gate Bonus", desc: "+1 on additive gates, +0.05x on multipliers", max: 20,
          cost: function (l) { return Math.round(500 * Math.pow(1.5, l)); } }
      ];

      var card = host.el("div", "card");
      card.appendChild(host.el("h2", null, "UPGRADES"));
      card.appendChild(host.el("p", "sub", A.formatNumber(save.gold) + " gold"));

      rows.forEach(function (r) {
        var row = host.el("div", "shopRow");
        var left = host.el("div");
        left.appendChild(host.el("h4", null, r.name + "  ·  LV " + (save[r.key] + 1)));
        left.appendChild(host.el("p", null, r.desc));
        row.appendChild(left);

        var maxed = save[r.key] >= r.max;
        var cost = r.cost(save[r.key]);
        var buy = host.el("button", "buy");
        buy.innerHTML = maxed ? "MAX" : A.formatNumber(cost) + "<small>GOLD</small>";
        buy.disabled = maxed || save.gold < cost;
        buy.addEventListener("click", function () {
          if (save.gold >= cost) {
            save.gold -= cost;
            save[r.key]++;
            host.commit();
            A.Audio.sfx("coin");
            openShop();
          }
        });
        row.appendChild(buy);
        card.appendChild(row);
      });

      card.appendChild(host.button("BACK", "ghost", function () { host.modal.hide(); prepare(); }));
      host.modal.show(card);
    }

    /* -------------------------------------------------------- render ---- */
    function fogAt(z) { return cam.fog(z, 34, 165) * 0.86; }
    function F(color, z) { return A.rgb(A.mix(color, PAL.fog, fogAt(z))); }

    function render(g) {
      var w = A.View.w, h = A.View.h;
      if (!grads || grads.w !== w || grads.h !== h || grads.horizon !== cam.horizon) buildGradients(g);
      A.Fx.applyShake(g);

      drawSky(g, w, h);
      drawHills(g, w);
      drawTerrain(g);

      var items = [];
      for (var i = 0; i < S.scenery.length; i++) {
        var item = S.scenery[i];
        if (item.z > cam.z + 2 && item.z < cam.z + 200) items.push({ z: item.z, fn: drawScenery, a: item });
      }
      if (S.level.towerDistance - cam.z < 230) items.push({ z: S.level.towerDistance, fn: drawKeep });
      S.level.gates.forEach(function (gate) { if (!gate.consumed) items.push({ z: gate.z, fn: drawGate, a: gate }); });
      S.level.obstacles.forEach(function (o) { items.push({ z: o.z, fn: drawObstacle, a: o }); });
      S.units.forEach(function (u) { items.push({ z: u.z, fn: drawUnit, a: u }); });
      items.push({ z: S.level.length, fn: drawFinish });

      items.sort(function (a, b) { return b.z - a.z; });
      for (var k = 0; k < items.length; k++) items[k].fn(g, items[k].a);

      A.Fx.drawParticles(g, cam.project);
      A.Fx.drawTexts(g, cam.project);

      g.fillStyle = grads.vig;
      g.fillRect(0, 0, w, h);

      g.restore();
      A.Fx.drawFlash(g, w, h);
    }

    function drawSky(g, w, h) {
      var bottom = cam.horizon + 2;
      g.fillStyle = grads.sky;
      g.fillRect(0, 0, w, bottom);

      var sunX = w * 0.5 - cam.x * 2.2;
      var sunY = cam.horizon - h * 0.055;
      var glow = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, h * 0.42);
      glow.addColorStop(0, A.rgba(PAL.sun, 0.75));
      glow.addColorStop(0.35, A.rgba(PAL.skyLow, 0.3));
      glow.addColorStop(1, A.rgba(PAL.skyLow, 0));
      g.fillStyle = glow;
      g.fillRect(0, 0, w, bottom);

      g.fillStyle = A.rgba(PAL.sun, 0.95);
      g.beginPath();
      g.arc(sunX, sunY, h * 0.052, 0, TAU);
      g.fill();

      for (var i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        var cx = A.wrap(c.x + S.t * c.drift - cam.x * 0.004, 1.4);
        var px = cx * w * 1.4 - w * 0.2;
        var py = c.y * cam.horizon;
        g.fillStyle = A.rgba(A.mix(PAL.sun, [255, 255, 255], 0.35), c.a);
        g.beginPath();
        g.ellipse(px, py, c.w * w, c.h * h, 0, 0, TAU);
        g.ellipse(px + c.w * w * 0.55, py + c.h * h * 0.28, c.w * w * 0.55, c.h * h * 0.72, 0, 0, TAU);
        g.fill();
      }
    }

    function hillLayer(g, w, color, amp, base, phase, parallax, step) {
      var offset = -cam.x * parallax - cam.z * parallax * 0.05;
      g.beginPath();
      g.moveTo(-10, cam.horizon + 4);
      for (var x = -10; x <= w + 10; x += step) {
        var t = (x + offset) * 0.0055;
        g.lineTo(x, cam.horizon - base - amp * (Math.sin(t + phase) * 0.62 + Math.sin(t * 2.17 + phase * 2.3) * 0.38));
      }
      g.lineTo(w + 10, cam.horizon + 4);
      g.closePath();
      g.fillStyle = color;
      g.fill();
    }

    function drawHills(g, w) {
      var h = A.View.h;
      hillLayer(g, w, A.rgb(A.mix(PAL.hillFar, PAL.fog, 0.45)), h * 0.055, h * 0.008, 0.7, 5, 16);
      hillLayer(g, w, A.rgb(A.mix(PAL.hillNear, PAL.fog, 0.22)), h * 0.036, 0, 2.4, 11, 12);
    }

    function drawTerrain(g) {
      var hw = S.level.halfWidth;
      var nearZ = cam.z + 3.2, farZ = cam.z + 210;
      var h = A.View.h, w = A.View.w;

      g.fillStyle = grads.ground;
      g.fillRect(0, cam.horizon, w, h - cam.horizon);

      A.strip(g, cam, -hw - 2.6, hw + 2.6, 0.02, 0.02, nearZ, farZ,
        A.rgb(A.mix(PAL.roadDark, PAL.grassDark, 0.35)));

      A.strip(g, cam, -hw, hw, 0.04, 0.04, nearZ, farZ, grads.road);

      var start = Math.floor(nearZ / 6) * 6;
      for (var z = start; z < Math.min(farZ, nearZ + 130); z += 6) {
        var fade = 1 - fogAt(z);
        if (fade <= 0.03) continue;
        g.globalAlpha = 0.34 * fade;
        A.strip(g, cam, -hw + 0.35, hw - 0.35, 0.05, 0.05, z, z + 1.6, A.rgb(PAL.lane));
        g.globalAlpha = 1;
      }

      for (var side = -1; side <= 1; side += 2) {
        var x = side * (hw + 0.5);
        A.strip(g, cam, x, x, 0, 1.75, nearZ, farZ, A.rgb(PAL.wall));
        A.strip(g, cam, x, x + side * 0.75, 1.75, 1.75, nearZ, farZ, A.rgb(PAL.wallTop));
      }
    }

    function drawScenery(g, item) {
      var base = cam.project(item.x, 0, item.z);
      if (!base) return;

      var s = base.s * item.scale;
      var fg = fogAt(item.z);

      if (item.kind === "tree") {
        g.fillStyle = A.rgba(PAL.ink, 0.22 * (1 - fg));
        g.beginPath(); g.ellipse(base.x, base.y, s, s * 0.3, 0, 0, TAU); g.fill();
        g.fillStyle = A.rgb(A.mix(PAL.trunk, PAL.fog, fg));
        g.fillRect(base.x - s * 0.14, base.y - s * 1.5, s * 0.28, s * 1.5);
        for (var i = 0; i < 3; i++) {
          var y = base.y - s * (1.4 + i * 0.85);
          var r = s * (1.25 - i * 0.28);
          g.fillStyle = A.rgb(A.mix(i === 0 ? PAL.treeDark : PAL.tree, PAL.fog, fg));
          g.beginPath();
          g.moveTo(base.x, y - r * 1.5);
          g.lineTo(base.x + r, y + r * 0.35);
          g.lineTo(base.x - r, y + r * 0.35);
          g.closePath();
          g.fill();
        }
      } else if (item.kind === "rock") {
        g.fillStyle = A.rgb(A.mix(PAL.stoneDeep, PAL.fog, fg));
        g.beginPath(); g.ellipse(base.x, base.y - s * 0.28, s * 0.62, s * 0.42, 0, 0, TAU); g.fill();
        g.fillStyle = A.rgb(A.mix(PAL.stoneDark, PAL.fog, fg));
        g.beginPath(); g.ellipse(base.x - s * 0.12, base.y - s * 0.4, s * 0.36, s * 0.24, 0, 0, TAU); g.fill();
      } else {
        var top = base.y - s * 2.6;
        g.strokeStyle = A.rgb(A.mix(PAL.trunk, PAL.fog, fg));
        g.lineWidth = Math.max(1, s * 0.13);
        g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(base.x, top); g.stroke();
        var wave = Math.sin(S.t * 2.4 + item.z) * s * 0.18;
        g.fillStyle = A.rgb(A.mix(PAL.red, PAL.fog, fg));
        g.beginPath();
        g.moveTo(base.x, top);
        g.lineTo(base.x + s * 0.95, top + s * 0.3 + wave);
        g.lineTo(base.x, top + s * 0.78);
        g.closePath();
        g.fill();
      }
    }

    function drawGate(g, gate) {
      var gx = gateX(gate);
      var f = cam.plane(gate.z);
      if (!f || f.s < 0.9) return;

      var good = gateIsGood(gate.type, gate.value);
      var tint = good ? PAL.jade : PAL.red;
      var fg = fogAt(gate.z);
      var alpha = 1 - fg * 0.8;

      var halfW = gateHalfWidth() - 0.12;
      var lx = f.px(gx - halfW), rx = f.px(gx + halfW);
      var y0 = f.py(0.05), yField = f.py(3.7), yTop = f.py(4.35);

      g.globalAlpha = alpha;

      var cxs = (lx + rx) / 2;
      var glow = g.createRadialGradient(cxs, (y0 + yTop) / 2, 0, cxs, (y0 + yTop) / 2, (rx - lx) * 0.9);
      glow.addColorStop(0, A.rgba(tint, 0.34));
      glow.addColorStop(1, A.rgba(tint, 0));
      g.fillStyle = glow;
      g.fillRect(lx - (rx - lx) * 0.5, yTop - 20, (rx - lx) * 2, y0 - yTop + 40);

      var field = g.createLinearGradient(0, yField, 0, y0);
      field.addColorStop(0, A.rgba(tint, 0.14));
      field.addColorStop(1, A.rgba(tint, 0.42));
      g.fillStyle = field;
      g.fillRect(lx, yField, rx - lx, y0 - yField);

      g.globalAlpha = alpha * 0.5;
      g.fillStyle = "rgba(255,255,255,0.5)";
      for (var i = 0; i < 4; i++) {
        var t = A.wrap(S.t * 0.55 + i * 0.25 + gate.phase * 0.1, 1);
        g.fillRect(lx, yField + (y0 - yField) * t, rx - lx, Math.max(1, f.s * 0.035));
      }
      g.globalAlpha = alpha;

      var postW = f.s * 0.62;
      var stone = F(PAL.stone, gate.z), stoneD = F(PAL.stoneDark, gate.z);
      g.fillStyle = stone;
      g.fillRect(lx - postW * 0.5, yTop, postW, y0 - yTop);
      g.fillRect(rx - postW * 0.5, yTop, postW, y0 - yTop);
      g.fillStyle = stoneD;
      g.fillRect(lx - postW * 0.5, yTop, postW * 0.32, y0 - yTop);
      g.fillRect(rx - postW * 0.5, yTop, postW * 0.32, y0 - yTop);

      var lintelH = f.py(3.73) - yTop;
      g.fillStyle = stone;
      g.fillRect(lx - postW * 0.7, yTop, (rx - lx) + postW * 1.4, lintelH);
      g.fillStyle = A.rgba(tint, 0.85);
      g.fillRect(lx - postW * 0.7, yTop + lintelH * 0.26, (rx - lx) + postW * 1.4, lintelH * 0.34);

      var size = Math.max(12, f.s * 1.15);
      g.font = size + "px 'Titan One', 'Arial Black', sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.lineJoin = "round";
      g.lineWidth = Math.max(3, size * 0.2);
      g.strokeStyle = A.rgb(PAL.ink);
      var label = gateLabel(gate.type, gate.value);
      g.strokeText(label, cxs, f.py(1.85));
      g.fillStyle = good ? "#FFFFFF" : "#FFB2AC";
      g.fillText(label, cxs, f.py(1.85));

      g.globalAlpha = 1;
    }

    function drawObstacle(g, o) {
      var pos = obstaclePos(o);
      var f = cam.plane(pos.z);
      if (!f || f.s < 0.9) return;

      var fg = fogAt(pos.z);
      var s = f.s;
      var cx = f.px(pos.x), gy = f.py(0);

      g.globalAlpha = (1 - fg) * 0.55;
      g.strokeStyle = A.rgb(PAL.red);
      g.lineWidth = Math.max(1.5, s * 0.055);
      g.setLineDash([s * 0.22, s * 0.18]);
      g.beginPath();

/* ===========================================================================

          var placed = 0;

          /* Fixed attempt budget rather than retrying until success: a dense
             block can genuinely run out of room, and the old retry loop could
             spin on that. A missing prop is invisible; a hang is not. */
          for (var n = 0; n < count * 4 && placed < count; n++) {
            var proto = rollProp(rand, level, ring);
            var px = bx + rand.range(-bw * 0.44, bw * 0.44);
            var py = by + rand.range(-bh * 0.44, bh * 0.44);

            var ok = true;
            for (var t = props.length - 1; t >= 0; t--) {
              var q = props[t];
              if (q.bx !== cx || q.by !== cy) continue;
              var need = (q.r + proto.r) * 0.88;
              if (A.dist2(px, py, q.x, q.y) < need * need) { ok = false; break; }
            }
            if (!ok) continue;
            placed++;

            props.push({
              x: px, y: py, bx: cx, by: cy,
              r: proto.r, h: proto.h, w: proto.w,
              value: proto.value, tier: proto.tier,
              round: proto.round, key: proto.key,
              color: A.hex(proto.color),
              spin: rand.range(0, A.TAU),
              sink: 0, taken: false, ang: 0, dropX: 0, dropY: 0
            });
          }
        }
      }

      /* Clear a landing pad so the opening seconds are never a wall of trucks. */
      for (var i = props.length - 1; i >= 0; i--) {
        if (props[i].tier >= 2 && A.dist2(props[i].x, props[i].y, 0, 0) < 165 * 165) {
          props.splice(i, 1);
        }
      }

      return {
        half: half, halfX: halfX, halfY: halfY,
        props: props, blocks: blocks, span: span, road: road,
        cellsX: cellsX, cellsY: cellsY
      };
    }

    /* -------------------------------------------------------------- run --- */
    function begin() {
      var level = save.level;
      var city = buildCity(level);

      var voids = [{
        player: true, name: "YOU", x: 0, y: 0, r: startRadius(),
        score: 0, tint: A.hex(0x5DE0FF), vx: 0, vy: 0, target: null, think: 0, alive: true
      }];

      var rivalCount = A.clamp(2 + Math.floor(level / 2), 2, 4);
      var rand = A.rng(0xC0FFEE ^ (level * 131));
      for (var i = 0; i < rivalCount; i++) {
        var ang = A.TAU * (i + 0.5) / rivalCount;
        voids.push({
          player: false,
          name: RIVAL_NAMES[(level * 3 + i) % RIVAL_NAMES.length],
          x: Math.cos(ang) * city.halfX * 0.60,
          y: Math.sin(ang) * city.halfY * 0.60,
          /* Rivals start a touch behind so the first thirty seconds feel like a
             lead you earned, then their growth rate catches up. */
          r: startRadius() * 0.9,
          score: 0, tint: A.hex(RIVAL_TINTS[i % RIVAL_TINTS.length]),
          vx: 0, vy: 0, target: null, think: rand.range(0, 0.4), alive: true,
          skill: A.clamp01(0.42 + level * 0.05 + rand.range(-0.06, 0.06))
        });
      }

      S = {
        level: level,
        city: city,
        voids: voids,
        me: voids[0],
        time: runSeconds(),
        over: false,
        camX: 0, camY: 0, camScale: 1,
        milestone: 0,
        eaten: 0,
        combo: 0, comboTimer: 0,
        shockwave: 0,
        /* Opening grace. Long enough to reach the first cluster of props. */
        grace: 9
      };

      A.Fx.reset();
      computeLayout();
      paintHud();
      host.toast("DISTRICT " + level + "  ·  swallow the block");
    }

    function computeLayout() {
      layout = { w: A.View.w, h: A.View.h, unit: A.View.unit() };
      if (S) {
        S.camX = S.me.x;
        S.camY = S.me.y;
        S.camScale = targetScale(S.me.r);
      }
    }

    /** Zoom out as the void grows, so it always occupies a similar screen share.
        The constant matters more than it looks: too tight and the district reads
        as two enormous blocks with a dot in the middle, and the whole point of
        the format - watching the city shrink around you - never lands. */
    function targetScale(r) {
      if (!layout) return 1;
      /* Never zoom out past the point where the whole district fits: past that
         the city becomes a postage stamp in a sea of background, which is the
         opposite of the "the world is shrinking" feeling the zoom is for. */
      var floorScale = S
        ? Math.max(layout.w / (S.city.halfX * 2 + 150), layout.h / (S.city.halfY * 2 + 150))
        : 0.2;
      return A.clamp(layout.unit / (r * 22 + 330), floorScale, 1.1);
    }

    /* ------------------------------------------------------------- eating -- */
    /** Radius after absorbing `area`. Areas add, radii do not - that keeps the
        curve honest: doubling the mouth needs four times the city. */
    function grow(v, area) {
      /* Rivals bank less of what they eat. Without the handicap a bot that
         happens to spawn on a dense block snowballs past the player inside the
         first three seconds, which reads as the game cheating rather than as a
         race. */
      var gain = area * (v.player ? growthScale() : 0.62);
      var a = Math.PI * v.r * v.r + gain;
      v.r = Math.sqrt(a / Math.PI);
    }

    function canEat(v, p) { return !p.taken && p.r <= v.r * 0.94; }

    function swallow(v, p) {
      p.taken = true;
      p.sink = 0.0001;
      p.ang = Math.atan2(p.y - v.y, p.x - v.x);
      p.dropX = v.x;
      p.dropY = v.y;
      p.eater = v;

      grow(v, Math.PI * p.r * p.r * 0.62);
      v.score += p.value;

      if (v.player) {
        S.eaten++;
        S.combo++;
        S.comboTimer = 1.5;
        A.Audio.sfx(p.tier >= 4 ? "boom" : "pop");

        if (p.tier >= 4) {
          A.Fx.kick(p.tier >= 5 ? 9 : 5);
          A.Fx.burst(v.x, v.y, 0, 14, { color: p.color, speed: 190, life: 0.5 });
          S.shockwave = 1;
        }
        if (S.combo >= 3 && S.combo % 5 === 0) {
          A.Fx.text(v.x, v.y - v.r - 22, 0, "x" + S.combo, [255, 214, 84], { life: 0.7, rise: 60 });
        }
      }
    }

    /* One void can swallow another. The bar is deliberately high (1.35x, centre
       well inside the mouth) so a narrow lead never turns into an instant
       unrecoverable loss, and the player gets a grace period on top. */
    function tryDevourVoids() {
      for (var i = 0; i < S.voids.length; i++) {
        var a = S.voids[i];
        if (!a.alive) continue;
        for (var j = 0; j < S.voids.length; j++) {
          if (i === j) continue;
          var b = S.voids[j];
          if (!b.alive || a.r < b.r * 1.35) continue;
          if (b.player && S.grace > 0) continue;
          var bite = a.r * 0.70;
          if (A.dist2(a.x, a.y, b.x, b.y) > bite * bite) continue;

          b.alive = false;
          grow(a, Math.PI * b.r * b.r * 0.5);
          a.score += Math.round(b.score * 0.5);

          if (a.player) {
            host.toast("SWALLOWED " + b.name);
            A.Fx.kick(11);
            A.Fx.flashScreen(0.3, [93, 224, 255]);
          } else if (b.player) {
            finish("eaten by " + a.name);
            return;
          }
        }
      }
    }

    /* ------------------------------------------------------------- rivals -- */
    function steerRival(v, dt) {
      v.think -= dt;

      if (v.think <= 0 || !v.target || v.target.taken) {
        v.think = A.lerp(0.55, 0.16, v.skill);

        /* Score every candidate by value over travel time, then take the best.
           Low skill rivals sample a small random slice instead, which makes
           them wander plausibly rather than looking broken. */
        var best = null, bestScore = -1;
        var props = S.city.props;
        var samples = Math.round(A.lerp(26, 150, v.skill));
        var step = Math.max(1, Math.floor(props.length / samples));
        var offset = Math.floor(Math.random() * step);

        for (var i = offset; i < props.length; i += step) {
          var p = props[i];
          if (!canEat(v, p)) continue;
          var d = Math.sqrt(A.dist2(v.x, v.y, p.x, p.y)) + 1;
          var s = p.value / d;
          if (s > bestScore) { bestScore = s; best = p; }
        }

        /* A big rival that has run out of food goes hunting smaller voids. */
        if (!best) {
          for (var k = 0; k < S.voids.length; k++) {
            var o = S.voids[k];
            if (o === v || !o.alive || v.r < o.r * 1.3) continue;
            best = { x: o.x, y: o.y, taken: false, chase: o };
            break;
          }
        }
        v.target = best;
      }

      if (!v.target) return;
      var tx = v.target.chase ? v.target.chase.x : v.target.x;
      var ty = v.target.chase ? v.target.chase.y : v.target.y;
      var dx = tx - v.x, dy = ty - v.y;
      var len = Math.hypot(dx, dy) || 1;
      var speed = (148 + S.level * 7) * A.lerp(0.80, 1.04, v.skill);
      v.vx = (dx / len) * speed;
      v.vy = (dy / len) * speed;
    }

    /* -------------------------------------------------------------- step -- */
    function update(dt) {
      A.Fx.update(dt);
      if (S.over) return;

      S.time -= dt;
      if (S.time <= 0) { S.time = 0; finish("time"); return; }

      S.shockwave = Math.max(0, S.shockwave - dt * 2.4);
      if (S.grace > 0) S.grace = Math.max(0, S.grace - dt);
      if (S.comboTimer > 0) {
        S.comboTimer -= dt;
        if (S.comboTimer <= 0) S.combo = 0;
      }

      /* Player steering: drag anywhere, the void chases the finger offset.
         Keyboard falls back to the arrow keys for the desktop build. */
      var me = S.me;
      var speed = moveSpeed();
      if (A.Input.down && layout) {
        var dx = A.Input.x - layout.w / 2;
        var dy = A.Input.y - layout.h / 2;
        var len = Math.hypot(dx, dy);
        var reach = layout.unit * 0.22;
        var mag = A.clamp01(len / reach);
        if (len > 4) {
          me.vx = (dx / len) * speed * mag;
          me.vy = (dy / len) * speed * mag;
        }
      } else {
        var kx = 0, ky = 0;
        if (A.Input.keyPressed("arrowleft") || A.Input.keyPressed("a")) kx -= 1;
        if (A.Input.keyPressed("arrowright") || A.Input.keyPressed("d")) kx += 1;
        if (A.Input.keyPressed("arrowup") || A.Input.keyPressed("w")) ky -= 1;
        if (A.Input.keyPressed("arrowdown") || A.Input.keyPressed("s")) ky += 1;
        if (kx || ky) {
          var kl = Math.hypot(kx, ky);
          me.vx = (kx / kl) * speed;
          me.vy = (ky / kl) * speed;
        } else {
          me.vx *= Math.exp(-7 * dt);
          me.vy *= Math.exp(-7 * dt);
        }
      }

      var i;
      for (i = 1; i < S.voids.length; i++) {
        if (S.voids[i].alive) steerRival(S.voids[i], dt);
      }

      var boundX = S.city.halfX + 40, boundY = S.city.halfY + 40;
      for (i = 0; i < S.voids.length; i++) {
        var v = S.voids[i];
        if (!v.alive) continue;
        v.x = A.clamp(v.x + v.vx * dt, -boundX, boundX);
        v.y = A.clamp(v.y + v.vy * dt, -boundY, boundY);
      }

      /* Eating pass. Props are static so a plain distance test is enough; at
         a few hundred props over four voids this stays comfortably cheap. */
      var props = S.city.props;
      for (i = 0; i < props.length; i++) {
        var p = props[i];
        if (p.taken) continue;
        for (var j = 0; j < S.voids.length; j++) {
          var vv = S.voids[j];
          if (!vv.alive || !canEat(vv, p)) continue;
          /* Bite when the prop centre is inside the mouth, minus a little so
             things visibly reach the lip before they tip in. */
          var reach = vv.r * 0.86;
          if (A.dist2(vv.x, vv.y, p.x, p.y) < reach * reach) { swallow(vv, p); break; }
        }
      }

      /* Sink animation: spiral in, shrink, then stop drawing. */
      for (i = 0; i < props.length; i++) {
        if (props[i].taken && props[i].sink < 1) {
          props[i].sink = Math.min(1, props[i].sink + dt * 2.6);
        }
      }

      tryDevourVoids();
      if (S.over) return;

      /* Milestone callouts. */
      while (S.milestone < MILESTONES.length && me.r >= MILESTONES[S.milestone].r) {
        host.toast("BIG ENOUGH FOR " + MILESTONES[S.milestone].text);
        A.Audio.sfx("levelup");
        A.Fx.flashScreen(0.16, [93, 224, 255]);
        S.milestone++;
      }

      /* Camera. */
      S.camX = A.approach(S.camX, me.x, 7, dt);
      S.camY = A.approach(S.camY, me.y, 7, dt);
      S.camScale = A.approach(S.camScale, targetScale(me.r), 2.4, dt);

      /* Keep the district filling the frame. Once the view is wider than the
         city on an axis the camera locks to the centre on that axis. */
      var limX = S.city.halfX + 30, limY = S.city.halfY + 30;
      var halfViewX = (layout.w * 0.5) / S.camScale;
      var halfViewY = (layout.h * 0.5) / S.camScale;
      S.camX = halfViewX >= limX ? 0 : A.clamp(S.camX, -(limX - halfViewX), limX - halfViewX);
      S.camY = halfViewY >= limY ? 0 : A.clamp(S.camY, -(limY - halfViewY), limY - halfViewY);

      paintHud();
    }

    /* ------------------------------------------------------------ results -- */
    function standings() {
      var list = S.voids.slice();
      list.sort(function (a, b) {
        if (a.alive !== b.alive) return a.alive ? -1 : 1;
        return b.score - a.score;
      });
      return list;
    }

    function finish(reason) {
      if (S.over) return;
      S.over = true;

      var order = standings();
      var place = order.indexOf(S.me) + 1;
      var won = place === 1 && S.me.alive;

      var coins = Math.round(S.me.score * 0.42 * host.coinMultiplier() * (won ? 1.6 : 1));
      save.coins += coins;
      save.runs++;
      if (S.me.score > save.best) save.best = S.me.score;
      if (won) {
        save.wins++;
        save.level++;
      }
      host.commit();

      var xp = Math.round((22 + S.me.score * 0.05) * host.xpMultiplier());
      host.addXp(xp);
      host.progress("run", 1);
      host.progress("coins", coins);
      if (won) host.progress("win", 1);

      A.Audio.sfx(won ? "win" : "lose");

      var lines = [];
      for (var i = 0; i < order.length; i++) {
        var v = order[i];
        lines.push({
          label: (i + 1) + ".  " + v.name + (v.alive ? "" : "  (out)"),
          value: A.formatNumber(v.score)
        });
      }

      host.results({
        title: won ? "DISTRICT TAKEN" : (reason === "time" ? "OUT OF TIME" : "SWALLOWED"),
        subtitle: won
          ? "District " + save.level + " unlocked"
          : (reason === "time" ? "Finished " + place + " of " + order.length : "A bigger void got you"),
        rows: [
          { label: "Score", value: A.formatNumber(S.me.score) },
          { label: "Props eaten", value: S.eaten },
          { label: "Final size", value: Math.round(S.me.r) },
          { label: "Coins", value: "+" + A.formatNumber(coins) },
          { label: "XP", value: "+" + xp }
        ].concat(lines),
        actions: [
          { label: won ? "NEXT DISTRICT" : "RETRY", className: "go", onClick: function () { host.modal.hide(); begin(); } },
          { label: "UPGRADES", className: "gold", onClick: function () { host.modal.hide(); openShop(); } },
          { label: "MENU", className: "ghost", onClick: host.exit }
        ]
      });
    }
